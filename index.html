
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://tt-sensei.github.io/edu-effects/css/edu-effects.css">
  <link rel="stylesheet" href="https://tt-sensei.github.io/edu-effects/css/edu-editorial.css">
  <link rel="stylesheet" href="https://tt-sensei.github.io/edu-effects/css/edu-decorations.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="先生のための週案作成・時数集計・印刷・共有・保存ツール">
  <title>週案メーカー | TT-sensei</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="edu-app edu-style-editorial">
  <header class="app-header edu-header">
    <div class="brand">
      <h1>週案メーカー</h1>
      <span>作成・時数集計・印刷・共有</span>
    </div>

    <div class="week-nav" aria-label="週の移動">
      <button id="prevWeek" class="arrow" type="button" aria-label="前の週">‹</button>
      <button id="todayButton" class="today" type="button">今週</button>
      <div id="currentWeekLabel" class="week-label">読み込み中</div>
      <button id="nextWeek" class="arrow" type="button" aria-label="次の週">›</button>
    </div>

    <div class="header-actions">
      <span class="status-dot"><span id="saveStatus">保存済み</span></span>
      <button id="annualButton" class="header-button" type="button">年間予定</button>
      <button id="timetableButton" class="header-button" type="button">時間割登録</button>
      <button id="openSettingsHeader" class="header-button" type="button">設定</button>
      <button id="newWeekButton" class="header-button" type="button">週を空にする</button>
      <button id="importButton" class="header-button" type="button">読み込み</button>
      <button id="exportButton" class="header-button" type="button">書き出し</button>
      <button id="shareButton" class="header-button" type="button">共有</button>
      <button id="printButton" class="header-button primary" type="button">印刷</button>
      <input id="importInput" type="file" accept=".json,application/json" hidden>
    </div>
  </header>

  <main class="workspace">
    <section class="preview-panel edu-card" aria-label="週案プレビュー">
      <div class="preview-top">
        <div>
          <h2>週案プレビュー</h2>
          <p>週案のマスを直接入力できます。右側には便利機能をまとめています。</p>
        </div>
        <div class="preview-tools">入力内容はこの端末に自動保存</div>
      </div>

      <div id="planPreview" class="plan-preview-wrap"></div>
      <div id="summaryArea" class="summary-area"></div>
    </section>

    <aside class="settings-panel edu-card" aria-label="便利機能">
      <div id="editorPanel" class="editor-panel"></div>
    </aside>
  </main>

  <div id="timetableModal" class="timetable-modal hidden"></div>

  <div id="settingsModal" class="settings-modal hidden" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div id="settingsContent" class="settings-dialog"></div>
  </div>

  <div id="annualModal" class="settings-modal hidden" role="dialog" aria-modal="true" aria-labelledby="annualTitle">
    <div id="annualContent" class="settings-dialog"></div>
  </div>

  <div id="shareModal" class="share-modal hidden" role="dialog" aria-modal="true" aria-labelledby="shareTitle">
    <div class="share-dialog">
      <div class="selection-card-head">
        <div>
          <span class="eyebrow">SHARE</span>
          <h2 id="shareTitle">この週案を共有</h2>
        </div>
        <button id="shareClose" class="ghost-button" type="button">閉じる</button>
      </div>
      <p>共有URLには、現在の週案データを含めています。相手がURLを開くと、その内容を表示できます。</p>
      <textarea id="shareURL" class="share-url" readonly></textarea>
      <div class="dialog-actions">
        <button id="shareCopy" class="header-button primary" type="button">URLをコピー</button>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/render.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/timetable.js"></script>
  <script src="js/file.js"></script>
  <script src="js/share.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
