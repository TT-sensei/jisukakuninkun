<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>週案メーカー・Google同期</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      background: #f7f3ed;
      color: #2f2a27;
    }
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .card {
      width: min(480px, 100%);
      border: 1px solid #ded5cc;
      border-radius: 14px;
      background: #fffdf9;
      box-shadow: 0 18px 45px rgb(58 45 35 / 14%);
      padding: 24px;
    }
    .eyebrow {
      color: #7a6f67;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .14em;
    }
    h1 { margin: 5px 0 8px; font-size: 21px; }
    p { margin: 0; color: #756c66; font-size: 12px; line-height: 1.7; }
    .status {
      margin-top: 18px;
      min-height: 84px;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #ded5cc;
      background: #fff;
      font-size: 12px;
      line-height: 1.65;
    }
    .status strong { display: block; margin-bottom: 4px; }
    .status.error { border-color: #d9b2a8; background: #fff6f3; }
  </style>
</head>
<body>
  <main class="card">
    <span class="eyebrow">GOOGLE SYNC</span>
    <h1>週案メーカーをGoogleと接続しています</h1>
    <p>この画面は同期処理のためだけに使います。処理が終わると自動で閉じます。</p>
    <div id="status" class="status">
      <strong>確認中</strong>
      Googleアカウントと同期設定を確認しています。
    </div>
  </main>

  <script>
    (function() {
      const ALLOWED_ORIGIN = "https://tt-sensei.github.io";
      const params = new URLSearchParams(window.location.search);
      const nonce = params.get("nonce") || "";

      function post(type, payload) {
        if (!window.opener || !nonce) return;
        window.opener.postMessage({
          app: "jisukakuninkun-cloud",
          type: type,
          nonce: nonce,
          payload: payload || {}
        }, ALLOWED_ORIGIN);
      }

      function show(message, isError) {
        const status = document.getElementById("status");
        status.className = "status" + (isError ? " error" : "");
        status.innerHTML = "<strong>" + (isError ? "同期できませんでした" : "完了") + "</strong>" +
          String(message || "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;");
      }

      function finish() {
        setTimeout(function() {
          try { window.close(); } catch (error) {}
        }, 500);
      }

      function fail(error) {
        const message = error && error.message ? error.message : String(error || "不明なエラー");
        show(message, true);
        post("error", { message: message });
      }

      function run(action, payload) {
        if (action === "connect") {
          google.script.run
            .withSuccessHandler(function(result) {
              show(result.email + " で接続しました。", false);
              post("connected", result);
              finish();
            })
            .withFailureHandler(fail)
            .getCloudStateInfo();
          return;
        }

        if (action === "load") {
          google.script.run
            .withSuccessHandler(function(result) {
              if (!result.hasCloudState) {
                show("クラウドにはまだ週案が保存されていません。", false);
              } else {
                show(result.email + " の週案を読み込みました。", false);
              }
              post("loaded", result);
              finish();
            })
            .withFailureHandler(fail)
            .getCloudState();
          return;
        }

        if (action === "save") {
          google.script.run
            .withSuccessHandler(function(result) {
              show(result.email + " に保存しました。", false);
              post("saved", result);
              finish();
            })
            .withFailureHandler(fail)
            .saveCloudState(payload.state);
          return;
        }

        if (action === "clear") {
          google.script.run
            .withSuccessHandler(function(result) {
              show("クラウド上の週案を削除しました。", false);
              post("cleared", result);
              finish();
            })
            .withFailureHandler(fail)
            .clearCloudState();
        }
      }

      window.addEventListener("message", function(event) {
        if (event.origin !== ALLOWED_ORIGIN) return;
        if (event.source !== window.opener) return;
        const data = event.data || {};
        if (data.app !== "jisukakuninkun-cloud" || data.nonce !== nonce) return;
        run(data.type, data.payload || {});
      });

      if (!window.opener) {
        show("この画面は週案メーカーから開いてください。", true);
        return;
      }

      post("ready", { supported: true });
    }());
  </script>
</body>
</html>
